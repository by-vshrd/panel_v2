{% extends 'base.html' %}
{% block title %}Статистика серверов{% endblock %}
{% block content %}
<h2 style="color: var(--heading); margin-bottom: 1.5rem;">Статистика серверов (Live)</h2>

<!-- Подключаем Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .chart-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    height: 300px; /* Фиксированная высота */
    display: flex;
    flex-direction: column;
}
.chart-container canvas {
    flex-grow: 1;
    min-height: 0; /* Важно для флекс-контейнера */
}
    .server-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .server-title { font-size: 1.2rem; color: var(--heading); font-weight: bold; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge.online { background: rgba(63, 185, 80, 0.2); color: var(--success); }
    .badge.offline { background: rgba(248, 81, 73, 0.2); color: var(--danger); }
    .stat-row { display: flex; gap: 1rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .stat-row span { color: var(--muted); }
    .stat-row strong { color: var(--heading); }
    .charts-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .stats-grid, .charts-wrapper { grid-template-columns: 1fr; } }
</style>

<div class="stats-grid">
    <!-- Блок Сервер 1 -->
    <div class="chart-container">
        <div class="server-header">
            <div class="server-title">Сервер 1</div>
            <div id="status-1" class="badge offline">Загрузка...</div>
        </div>
        <div class="stat-row">Онлайн: <strong id="onlines-1">-</strong></div>
        <div class="stat-row">Uptime: <strong id="uptime-1">-</strong></div>
        <canvas id="trafficChart1" height="150"></canvas>
    </div>

    <!-- Блок Сервер 2 -->
    <div class="chart-container">
        <div class="server-header">
            <div class="server-title">Сервер 2</div>
            <div id="status-2" class="badge offline">Загрузка...</div>
        </div>
        <div class="stat-row">Онлайн: <strong id="onlines-2">-</strong></div>
        <div class="stat-row">Uptime: <strong id="uptime-2">-</strong></div>
        <canvas id="trafficChart2" height="150"></canvas>
    </div>
</div>

<div class="charts-wrapper">
    <div class="chart-container">
        <canvas id="cpuChart" height="200"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="ramChart" height="200"></canvas>
    </div>
</div>

<script>
// --- Настройка графиков ---
const commonOptions = {
    responsive: true,
    maintainAspectRatio: false,
    animation: false, // Отключаем анимацию для предотвращения зависаний
    plugins: { legend: { labels: { color: '#c9d1d9' } } },
    scales: {
        x: { ticks: { color: '#8b949e', maxTicksLimit: 6 }, grid: { color: '#30363d' } },
        y: {
            ticks: { color: '#8b949e' },
            grid: { color: '#30363d' },
            beginAtZero: true,
            suggestedMax: 100 // По умолчанию шкала до 100
        }
    }
};

// Инициализация графиков
const trafficChart1 = new Chart(document.getElementById('trafficChart1'), {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Up (KB/s)', data: [], borderColor: '#58a6ff', tension: 0.3, borderWidth: 2, pointRadius: 0 },
            { label: 'Down (KB/s)', data: [], borderColor: '#3fb950', tension: 0.3, borderWidth: 2, pointRadius: 0 }
        ]
    },
    options: { ...commonOptions, plugins: { title: { display: true, text: 'Трафик (Сервер 1)', color: '#f0f6fc' } } }
});

const trafficChart2 = new Chart(document.getElementById('trafficChart2'), {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Up (KB/s)', data: [], borderColor: '#58a6ff', tension: 0.3, borderWidth: 2, pointRadius: 0 },
            { label: 'Down (KB/s)', data: [], borderColor: '#3fb950', tension: 0.3, borderWidth: 2, pointRadius: 0 }
        ]
    },
    options: { ...commonOptions, plugins: { title: { display: true, text: 'Трафик (Сервер 2)', color: '#f0f6fc' } } }
});

const cpuChart = new Chart(document.getElementById('cpuChart'), {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'CPU % (S1)', data: [], borderColor: '#d29922', tension: 0.3, pointRadius: 0 },
            { label: 'CPU % (S2)', data: [], borderColor: '#f85149', tension: 0.3, pointRadius: 0 }
        ]
    },
    options: { ...commonOptions, plugins: { title: { display: true, text: 'Загрузка CPU', color: '#f0f6fc' } }, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, max: 100 } } }
});

const ramChart = new Chart(document.getElementById('ramChart'), {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'RAM % (S1)', data: [], borderColor: '#d29922', tension: 0.3, pointRadius: 0 },
            { label: 'RAM % (S2)', data: [], borderColor: '#f85149', tension: 0.3, pointRadius: 0 }
        ]
    },
    options: { ...commonOptions, plugins: { title: { display: true, text: 'Загрузка RAM', color: '#f0f6fc' } }, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, max: 100 } } }
});

// --- Логика обновления ---
let lastNet1 = null;
let lastNet2 = null;

function addData(chart, label, data1, data2) {
    // Защита от NaN и undefined
    const safeData1 = (typeof data1 === 'number' && !isNaN(data1) && isFinite(data1)) ? data1 : 0;
    const safeData2 = (typeof data2 === 'number' && !isNaN(data2) && isFinite(data2)) ? data2 : 0;

    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(safeData1);
    chart.data.datasets[1].data.push(safeData2);

    if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
    }
    chart.update('none'); // Обновляем без анимации
}

async function fetchStats() {
    try {
        const resp = await fetch('/accounts/api/stats/');
        if (!resp.ok) throw new Error('Network error');
        const data = await resp.json();
        const timeLabel = new Date().toLocaleTimeString('ru-RU', { hour12: false });

        // === Сервер 1 ===
        if (data.server1 && data.server1.online) {
            document.getElementById('status-1').className = 'badge online';
            document.getElementById('status-1').textContent = 'ONLINE';
            document.getElementById('onlines-1').textContent = data.server1.onlines;
            document.getElementById('uptime-1').textContent = data.server1.uptime;

            // Вычисляем скорость только если есть предыдущие данные
            if (lastNet1 !== null) {
                let speedUp1 = Math.max(0, (data.server1.net_up - lastNet1.up) / 1024 / 10);
                let speedDown1 = Math.max(0, (data.server1.net_down - lastNet1.down) / 1024 / 10);
                // Ограничиваем максимум 100000 КБ/с (100 МБ/с), чтобы график не улетал
                speedUp1 = Math.min(speedUp1, 100000);
                speedDown1 = Math.min(speedDown1, 100000);
                addData(trafficChart1, timeLabel, speedUp1, speedDown1);
            }
            lastNet1 = { up: data.server1.net_up, down: data.server1.net_down };
        } else {
            document.getElementById('status-1').className = 'badge offline';
            document.getElementById('status-1').textContent = 'OFFLINE';
            lastNet1 = null; // сбрасываем, чтобы при возврате сервера не было скачка
        }

        // === Сервер 2 ===
        if (data.server2 && data.server2.online) {
            document.getElementById('status-2').className = 'badge online';
            document.getElementById('status-2').textContent = 'ONLINE';
            document.getElementById('onlines-2').textContent = data.server2.onlines;
            document.getElementById('uptime-2').textContent = data.server2.uptime;

            if (lastNet2 !== null) {
                let speedUp2 = Math.max(0, (data.server2.net_up - lastNet2.up) / 1024 / 10);
                let speedDown2 = Math.max(0, (data.server2.net_down - lastNet2.down) / 1024 / 10);
                speedUp2 = Math.min(speedUp2, 100000);
                speedDown2 = Math.min(speedDown2, 100000);
                addData(trafficChart2, timeLabel, speedUp2, speedDown2);
            }
            lastNet2 = { up: data.server2.net_up, down: data.server2.net_down };
        } else {
            document.getElementById('status-2').className = 'badge offline';
            document.getElementById('status-2').textContent = 'OFFLINE';
            lastNet2 = null;
        }

        // === Общие графики CPU и RAM ===
        const cpu1 = (data.server1 && data.server1.online) ? data.server1.cpu : 0;
        const cpu2 = (data.server2 && data.server2.online) ? data.server2.cpu : 0;
        const ram1 = (data.server1 && data.server1.online) ? data.server1.mem_percent : 0;
        const ram2 = (data.server2 && data.server2.online) ? data.server2.mem_percent : 0;

        addData(cpuChart, timeLabel, cpu1, cpu2);
        addData(ramChart, timeLabel, ram1, ram2);

    } catch (e) {
        console.error('Ошибка получения статистики', e);
    }
}

// Запуск с интервалом
fetchStats();
setInterval(fetchStats, 10000);
</script>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Статистика серверов{% endblock %}
{% block content %}
<h2 style="color: var(--heading); margin-bottom: 1.5rem;">Статистика серверов</h2>

<div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;" id="range-selectors">
    <button class="btn btn-outline range-btn active" data-range="live">Live (10с)</button>
    <button class="btn btn-outline range-btn" data-range="1m">1 минута</button>
    <button class="btn btn-outline range-btn" data-range="10m">10 минут</button>
    <button class="btn btn-outline range-btn" data-range="1h">1 час</button>
    <button class="btn btn-outline range-btn" data-range="24h">24 часа</button>
    <button class="btn btn-outline range-btn" data-range="7d">Неделя</button>
</div>

<div class="stats-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
    <div class="card server-card" style="padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin:0;">Сервер 1</h3>
            <span id="s1-status" class="badge offline" style="background: var(--border); color: var(--muted); padding: 0.3rem 0.8rem; border-radius: 4px;">Ожидание</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.9rem;">
            <div>CPU: <strong id="s1-cpu" style="color: var(--accent);">0%</strong></div>
            <div>RAM: <strong id="s1-ram" style="color: #d29922;">0%</strong></div>
            <div>Онлайн: <strong id="s1-onlines" style="color: var(--success);">0</strong></div>
            <div>Uptime: <strong id="s1-uptime" style="color: var(--text);">0д 0ч</strong></div>
        </div>
    </div>

    <div class="card server-card" style="padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin:0;">Сервер 2</h3>
            <span id="s2-status" class="badge offline" style="background: var(--border); color: var(--muted); padding: 0.3rem 0.8rem; border-radius: 4px;">Ожидание</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.9rem;">
            <div>CPU: <strong id="s2-cpu" style="color: var(--accent);">0%</strong></div>
            <div>RAM: <strong id="s2-ram" style="color: #d29922;">0%</strong></div>
            <div>Онлайн: <strong id="s2-onlines" style="color: var(--success);">0</strong></div>
            <div>Uptime: <strong id="s2-uptime" style="color: var(--text);">0д 0ч</strong></div>
        </div>
    </div>
</div>

<!-- Графики -->
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
    <div class="card" style="padding: 1rem; height: 300px; position: relative;">
        <canvas id="chartNetwork"></canvas>
    </div>
    <div class="card" style="padding: 1rem; height: 300px; position: relative;">
        <canvas id="chartSystem"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Настройка шрифтов и цветов Chart.js
Chart.defaults.color = '#8b949e';
Chart.defaults.font.family = 'system-ui, -apple-system, sans-serif';
Chart.defaults.borderColor = '#30363d';

// Функция создания градиента для заливки
function createGradient(ctx, colorStart, colorEnd) {
    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, colorStart);
    gradient.addColorStop(1, colorEnd);
    return gradient;
}

// Инициализация графиков
const ctxNet = document.getElementById('chartNetwork').getContext('2d');
const chartNetwork = new Chart(ctxNet, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Upload', data: [], borderColor: '#58a6ff', backgroundColor: createGradient(ctxNet, 'rgba(88,166,255,0.3)', 'rgba(88,166,255,0)'), fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
            { label: 'Download', data: [], borderColor: '#3fb950', backgroundColor: createGradient(ctxNet, 'rgba(63,185,80,0.3)', 'rgba(63,185,80,0)'), fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 }
        ]
    },
    options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Сетевой трафик (Сервер 1)', color: '#f0f6fc' }, legend: { position: 'top' } },
        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#30363d' } } },
        animation: { duration: 500 }
    }
});

const ctxSys = document.getElementById('chartSystem').getContext('2d');
const chartSystem = new Chart(ctxSys, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'CPU S1', data: [], borderColor: '#d29922', backgroundColor: createGradient(ctxSys, 'rgba(210,153,34,0.3)', 'rgba(210,153,34,0)'), fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
            { label: 'RAM S1', data: [], borderColor: '#f85149', backgroundColor: createGradient(ctxSys, 'rgba(248,81,73,0.3)', 'rgba(248,81,73,0)'), fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 }
        ]
    },
    options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Системные ресурсы (Сервер 1)', color: '#f0f6fc' }, legend: { position: 'top' } },
        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, max: 100, grid: { color: '#30363d' } } },
        animation: { duration: 500 }
    }
});

// Переменные для хранения предыдущих значений трафика (для Live)
let lastNet = { up: 0, down: 0 };
let currentRange = 'live';
let intervalId = null;

// Обработка кнопок периода
document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active', 'btn'));
        document.querySelectorAll('.range-btn').forEach(b => b.classList.add('btn-outline'));
        this.classList.remove('btn-outline');
        this.classList.add('active', 'btn');

        currentRange = this.dataset.range;
        fetchData();
    });
});

async function fetchData() {
    try {
        const resp = await fetch(`/accounts/api/stats/?range=${currentRange}`);
        const data = await resp.json();

        if (currentRange === 'live') {
            // Обновляем карточки
            if (data.server1 && data.server1.online) {
                document.getElementById('s1-status').textContent = 'ONLINE';
                document.getElementById('s1-status').style.cssText = 'background: rgba(63,185,80,0.2); color: var(--success); padding: 0.3rem 0.8rem; border-radius: 4px; font-weight:bold;';
                document.getElementById('s1-cpu').textContent = data.server1.cpu + '%';
                document.getElementById('s1-ram').textContent = data.server1.mem_percent + '%';
                document.getElementById('s1-onlines').textContent = data.server1.onlines;
                document.getElementById('s1-uptime').textContent = data.server1.uptime;

                // Считаем скорость
                if (lastNet.up > 0) {
                    let speedUp = Math.max(0, (data.server1.net_up - lastNet.up) / 1024 / 10);
                    let speedDown = Math.max(0, (data.server1.net_down - lastNet.down) / 1024 / 10);

                    // Добавляем на график
                    const time = new Date().toLocaleTimeString('ru-RU', {hour12:false});
                    chartNetwork.data.labels.push(time);
                    chartNetwork.data.datasets[0].data.push(speedUp);
                    chartNetwork.data.datasets[1].data.push(speedDown);

                    if (chartNetwork.data.labels.length > 20) {
                        chartNetwork.data.labels.shift();
                        chartNetwork.data.datasets.forEach(ds => ds.data.shift());
                    }
                    chartNetwork.update('none');
                }
                lastNet = { up: data.server1.net_up, down: data.server1.net_down };

                // Системные ресурсы (Live)
                const time = new Date().toLocaleTimeString('ru-RU', {hour12:false});
                chartSystem.data.labels.push(time);
                chartSystem.data.datasets[0].data.push(data.server1.cpu);
                chartSystem.data.datasets[1].data.push(data.server1.mem_percent);
                if (chartSystem.data.labels.length > 20) {
                    chartSystem.data.labels.shift();
                    chartSystem.data.datasets.forEach(ds => ds.data.shift());
                }
                chartSystem.update('none');
            }
        } else {
            // Режим истории
            const s1Data = data.server1 || [];
            chartNetwork.data.labels = s1Data.map(d => d.time);
            // Считаем разницу трафика для истории (скорость)
            chartNetwork.data.datasets[0].data = s1Data.map((d, i) => i === 0 ? 0 : Math.max(0, (d.up - s1Data[i-1].up) / 1024 / 60));
            chartNetwork.data.datasets[1].data = s1Data.map((d, i) => i === 0 ? 0 : Math.max(0, (d.down - s1Data[i-1].down) / 1024 / 60));
            chartNetwork.update();

            chartSystem.data.labels = s1Data.map(d => d.time);
            chartSystem.data.datasets[0].data = s1Data.map(d => d.cpu);
            chartSystem.data.datasets[1].data = s1Data.map(d => d.mem);
            chartSystem.update();
        }
    } catch (e) {
        console.error("Ошибка загрузки статистики", e);
    }
}

// Управление автообновлением
function startLive() {
    if (intervalId) clearInterval(intervalId);
    fetchData();
    intervalId = setInterval(fetchData, 10000);
}

// Инициализация
startLive();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VPN Панель{% endblock %}</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --heading: #f0f6fc; --muted: #8b949e;
            --accent: #58a6ff; --success: #3fb950; --danger: #f85149;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--text); min-height: 100vh;
               display: flex; flex-direction: column; line-height: 1.5; }
        .navbar { background: var(--card); border-bottom: 1px solid var(--border);
                  padding: 0 1.5rem; height: 56px; display: flex; align-items: center;
                  justify-content: space-between; position: sticky; top: 0; z-index: 10; }
        .navbar .logo { font-weight: 600; font-size: 1.2rem; color: var(--heading); text-decoration: none; }
        .navbar nav { display: flex; align-items: center; gap: 1.5rem; }
        .navbar nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; }
        .navbar nav a:hover { color: var(--accent); }
        .btn { display: inline-block; background: var(--accent); color: #fff !important;
               padding: 0.55rem 1.4rem; border-radius: 6px; font-weight: 500;
               text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text) !important; }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent) !important; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .container { max-width: 780px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; flex: 1; }
        .card { background: var(--card); border: 1px solid var(--border);
                border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2, .card h3 { color: var(--heading); margin-bottom: 1rem; font-size: 1.2rem; }
        label { display: block; margin: 0.5rem 0 0.3rem; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.6rem 0.8rem; color: var(--text); font-size: 0.95rem; }
        input:focus { border-color: var(--accent); outline: none; }
        .messages { margin-bottom: 1rem; }
        .message { padding: 0.7rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; color: #fff; }
        .message.success { background: var(--success); }
        .message.error { background: var(--danger); }
        .message.info { background: var(--accent); }
        .footer { text-align: center; padding: 1.5rem 0; color: var(--muted); font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
        .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
        .hamburger span { display: block; width: 25px; height: 3px; background: var(--text);
                          margin: 4px 0; border-radius: 2px; }
        @media (max-width: 700px) {
            .navbar nav { display: none; flex-direction: column; position: absolute;
                          top: 56px; left: 0; right: 0; background: var(--card);
                          padding: 1rem; gap: 0.7rem; border-bottom: 1px solid var(--border); }
            .navbar.open nav { display: flex; }
            .hamburger { display: block; }
            .container { margin: 1rem auto; padding: 0 1rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="navbar" id="navbar">
        <a href="/" class="logo">🔒 VPN</a>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Кабинет</a>
                {% if user.is_staff %}
                    <a href="{% url 'admin_dashboard' %}">Админка</a>
                    <a href="{% url 'admin_settings' %}">Настройки</a>
                {% endif %}
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'signup' %}" class="btn">Регистрация</a>
            {% endif %}
        </nav>
    </div>
    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for msg in messages %}
            <div class="message {{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script>
        document.getElementById('hamburger').addEventListener('click', function () {
            document.getElementById('navbar').classList.toggle('open');
        });
    </script>
</body>
</html>
